server {
    listen 80;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # API routes are unprefixed on the FastAPI side — proxy each root path.
    location ~ ^/(live|sessions|match|analyze|compare|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # TradingView fetch + DTW matching can take a moment
    }
}
