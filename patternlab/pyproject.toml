[project]
name = "patternlab"
version = "0.1.0"
description = "Structural price-pattern recognition engine for financial time series (XAUUSD M1 focus)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",
    "tvdatafeed",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patternlab"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
tvdatafeed = { git = "https://github.com/rongardF/tvdatafeed" }
